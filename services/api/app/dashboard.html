<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NahaLabs AI Operator</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #111827; }
    header { padding: 28px 32px; background: #111827; color: white; }
    main { max-width: 1050px; margin: 28px auto; padding: 0 20px; }
    textarea { width: 100%; min-height: 110px; box-sizing: border-box; padding: 14px; border: 1px solid #cbd5e1; border-radius: 10px; }
    button { margin-top: 10px; padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer; }
    .primary { background: #111827; color: white; }
    select, input[type=file] { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 8px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; }
    .panel { background: white; padding: 16px; border-radius: 10px; border: 1px solid #e5e7eb; margin: 12px 0; }
    .job { padding: 16px; background: white; border-radius: 10px; margin: 10px 0; border: 1px solid #e5e7eb; }
    .mono { font-family: ui-monospace, monospace; font-size: 12px; color: #64748b; }
    .status { margin-top: 8px; color: #475569; }
  </style>
</head>
<body>
<header><strong>NahaLabs AI Operator</strong><div class="mono">Windows → Cloud → ARTEMIS → Android</div></header>
<main>
  <div class="panel">
    <h2>Bring desktop data into the operator</h2>
    <input id="file" type="file" accept=".csv,.xlsx" />
    <button onclick="uploadFile()">Upload CSV/XLSX</button>
    <div id="fileStatus" class="status"></div>
    <select id="sourceFile">
      <option value="">No business file attached</option>
    </select>
  </div>

  <div class="panel">
    <h2>Dispatch mobile work</h2>
    <textarea id="instruction" placeholder="Example: Open the approved store-operations app and check today's opening checklist for the stores in the attached file."></textarea>
    <button class="primary" onclick="createJob()">Dispatch job</button>
  </div>

  <h2>Jobs</h2>
  <div id="jobs">Loading…</div>
</main>
<script>
async function uploadFile() {
  const input = document.getElementById('file');
  if (!input.files.length) return;
  const form = new FormData();
  form.append('file', input.files[0]);
  const response = await fetch('/v1/files/ingest', { method: 'POST', body: form });
  const data = await response.json();
  if (!response.ok) {
    document.getElementById('fileStatus').textContent = data.detail || 'Upload failed';
    return;
  }
  document.getElementById('fileStatus').textContent = `${data.filename}: ${data.rows} rows loaded`;
  await loadFiles(data.id);
}

async function loadFiles(selectedId = '') {
  const files = await (await fetch('/v1/files')).json();
  const select = document.getElementById('sourceFile');
  select.innerHTML = '<option value="">No business file attached</option>';
  for (const file of files) {
    const option = document.createElement('option');
    option.value = file.id;
    option.textContent = `${file.filename} (${file.bytes} bytes)`;
    if (file.id === selectedId) option.selected = true;
    select.appendChild(option);
  }
}

async function createJob() {
  const instruction = document.getElementById('instruction').value.trim();
  if (!instruction) return;
  const sourceFileId = document.getElementById('sourceFile').value || null;
  await fetch('/v1/jobs', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      instruction,
      profile: 'flash',
      source_file_id: sourceFileId,
      row_limit: 20
    })
  });
  document.getElementById('instruction').value = '';
  loadJobs();
}

async function loadJobs() {
  const jobs = await (await fetch('/v1/jobs')).json();
  document.getElementById('jobs').innerHTML = jobs.map(j => `
    <div class="job">
      <b>${escapeHtml(j.status)}</b> — ${escapeHtml(j.instruction)}
      <div class="mono">${escapeHtml(j.id)}${j.source_file_id ? ' · file attached' : ''}</div>
    </div>
  `).join('') || '<p>No jobs yet.</p>';
}

function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

loadFiles();
loadJobs();
setInterval(loadJobs, 2000);
</script>
</body>
</html>
